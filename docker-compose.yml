services:
  lotus-water-lab:
    build: .
    container_name: lotus-water-lab
    restart: unless-stopped
    environment:
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      PORT: 3000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@lotus.dvsncloud.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GUEST_EMAIL: ${GUEST_EMAIL:-guest@lotus.dvsncloud.com}
      GUEST_PASSWORD: ${GUEST_PASSWORD:-guest}
      GUEST_TTL_HOURS: ${GUEST_TTL_HOURS:-6}
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
